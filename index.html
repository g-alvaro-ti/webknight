<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/tela-inicio.css">
    <link rel="stylesheet" href="css/tela-jogo.css">
    <link rel="stylesheet" href="css/tela-batalha.css">
    <link rel="stylesheet" href="css/tela-fim.css">
    <link rel="stylesheet" href="css/sprites.css">
    
    <title>WebKnight</title>
</head>
<body>
    <!-- Tela inicial, contendo o cadastro do email do jogador-->
    <section id="tela-inicial">

    </section>

    <!-- Tela com o mapa do jogo, jogador e inimigos -->
    <section id="jogo">
        <input class="chave-api" type="text" placeholder="Chave API">
        <button class="testar-prompt-mapa">Gerar Mapa com Gemini</button>
        <div class="jogo-container">
            <div class="jogo-localizacao">
                Floresta
            </div>
            <div class="jogo-mapa-container">

            </div>
            <div class="jogo-narrativa">
                Você acordou em uma FLORESTA escura, sem saber como chegou ali. Ao seu redor, você vê árvores altas e sombras misteriosas. De repente, você ouve um rugido distante e percebe que não está sozinho. 
            </div>
        </div>
    </section>

    <!-- Interface da batalha de turnos -->
    <section id="batalha-turno">

    </section>

    <!-- Tela de fim pra quando perder, contendo o placar de líderes dos jogadores -->
    <section id="tela-fim">

    </section>

    <script src="src/script.js"></script>
    <script src="src/mapa.js"></script>
    <script src="src/prompt.js"></script>
</body>
</html>
